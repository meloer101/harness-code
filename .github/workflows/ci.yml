name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Build first: the test typecheck resolves workspace packages through
      # their published entry points, which only exist after a build.
      - run: pnpm build

      - run: pnpm typecheck

      - run: pnpm test

      # No network, no credentials: every provider test runs against recorded
      # or synthetic transports. A green CI here means the harness is
      # deterministic, not that someone's API key happened to work.
